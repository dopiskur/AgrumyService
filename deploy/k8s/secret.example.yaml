# TEMPLATE - do not `kubectl apply` this file as-is, and never commit a copy with real values filled
# in (same rule as .env/appsettings.json elsewhere in this repo: real secrets stay out of git).
# Preferred: create the Secret imperatively instead, so the values never touch a file at all:
#
#   kubectl create secret generic agrumy-secrets -n agrumy \
#     --from-literal=ConnectionStrings__DefaultConnection='Server=your-db-host;Port=3306;Database=agrumy;Uid=agrumy;Pwd=REPLACE_ME;' \
#     --from-literal=JWT__SecureKey='REPLACE_ME_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARACTERS'
#
# Only use this declarative form if you're already piping it through a secrets manager (sealed-secrets,
# External Secrets Operator, sops, etc.) that keeps the real values out of plain git history.
apiVersion: v1
kind: Secret
metadata:
  name: agrumy-secrets
type: Opaque
stringData:
  # MySQL/MariaDB example: "Server=host;Port=3306;Database=agrumy;Uid=agrumy;Pwd=...;"
  # PostgreSQL example: "Host=host;Port=5432;Database=agrumy;Username=agrumy;Password=..."
  # Must match configmap.yaml's Database__Provider.
  ConnectionStrings__DefaultConnection: "REPLACE_ME"

  # Symmetric HMAC-SHA256 JWT signing key, at least 32 random characters - same value for both
  # Agrumy.Api and Agrumy.Web (both Deployments read this same Secret), same rule as everywhere else
  # in this repo a JWT secret shows up.
  JWT__SecureKey: "REPLACE_ME_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
